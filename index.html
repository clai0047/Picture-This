<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>Picture This!</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <header class="header">
    <div class="title">
      <h1>Picture This!</h1>
      <h4>My Really Cool Blog Post</h4>
    </div>
    
    <picture>
      <!-- Square images are used when the viewport is 960px or wider-->
      <source media="(min-width: 960px)" 
      srcset="images/museum-square-480.jpg 480w,
              images/museum-square-600.jpg 600w,
              images/museum-square-800.jpg 800w,
              images/museum-square-1200.jpg 1200w,
              images/museum-square-1600.jpg 1600w,
              images/museum-square-1920.jpg 1920w,
              images/museum-square-2400.jpg 2400w">


      <!-- Landscape images are used when the viewport is below 960px -->  
              <img src="images/museum-landscape-480.jpg"
              srcset="images/museum-landscape-320.jpg 320w,
                      images/museum-landscape-480.jpg 480w,
                      images/museum-landscape-720.jpg 720w,
                      images/museum-landscape-960.jpg 960w,
                      images/museum-landscape-1440.jpg 1440w,
                      images/museum-landscape-2160.jpg 2160w,
                      images/museum-landscape-2880.jpg 2880w"
                      alt="museum">


    </picture>

  </header>
</body>

</html>
